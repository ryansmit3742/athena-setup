#cloud-config
# Base packages for an Athena server. Everything app-specific happens in install.sh,
# which is uploaded and run by setup.sh once the server is reachable.
package_update: true
package_upgrade: false
packages:
  - git
  - curl
  - ca-certificates
  - python3
  - python3-venv
  - python3-pip
  - postgresql
  - ffmpeg
  - ufw
runcmd:
  - [ bash, -c, "PGV=$(ls /usr/lib/postgresql | sort -n | tail -1); apt-get install -y postgresql-${PGV}-pgvector" ]
  - [ bash, -c, "ufw allow OpenSSH && ufw --force enable" ]
  - [ touch, /var/lib/athena-cloud-init-done ]
